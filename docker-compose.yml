name: cloudrevo

x-local-build-args: &local-build-args
  APK_REPOSITORY: https://mirrors.tuna.tsinghua.edu.cn/alpine
  NPM_REGISTRY: https://mirrors.cloud.tencent.com/npm
  GO_PROXY: https://goproxy.cn|https://proxy.golang.org,direct

services:
  test:
    build:
      context: .
      target: test
      args: *local-build-args
    profiles:
      - test

  gopeed-contract:
    build:
      context: .
      target: test
      args: *local-build-args
    profiles:
      - test
    depends_on:
      gopeed:
        condition: service_healthy
      download-fixture:
        condition: service_started
    environment:
      GOPEED_CONTRACT_URL: http://gopeed:9999
      GOPEED_CONTRACT_TOKEN: "${GOPEED_API_TOKEN:?Set GOPEED_API_TOKEN in .env before starting Compose}"
      GOPEED_CONTRACT_SOURCE_HOST: gopeed-contract-source
    volumes:
      - ./storage/cloudrevo/temp/gopeed:/cloudrevo/data/temp/gopeed
    networks:
      default:
        aliases:
          - gopeed-contract-source
    command: ["go", "test", "./pkg/downloader/gopeed", "-run", "TestComposeGopeed", "-count=1"]

  frontend-test:
    build:
      context: .
      target: frontend-test
      args: *local-build-args
    profiles:
      - test

  download-fixture:
    image: busybox:1.36.1
    command: ["httpd", "-f", "-p", "8080", "-h", "/srv"]
    profiles:
      - test
    volumes:
      - ./tests/fixtures/gopeed:/srv:ro

  cloudrevo:
    build:
      context: .
      args: *local-build-args
    container_name: cloudrevo-backend
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      gopeed:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - 5212:5212
    environment:
      CR_CONF_Database.Type: "${CLOUDREVO_DB_TYPE:-postgres}"
      CR_CONF_Database.Host: "${CLOUDREVO_DB_HOST:-postgresql}"
      CR_CONF_Database.User: "${CLOUDREVO_DB_USER:-cloudrevo}"
      CR_CONF_Database.Password: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env before starting Compose}"
      CR_CONF_Database.Name: "${CLOUDREVO_DB_NAME:-cloudrevo}"
      CR_CONF_Database.Port: "${CLOUDREVO_DB_PORT:-5432}"
      CR_CONF_Redis.Server: "${CLOUDREVO_REDIS_SERVER:-redis:6379}"
      CR_GOPEED_API_TOKEN: "${GOPEED_API_TOKEN:?Set GOPEED_API_TOKEN in .env before starting Compose}"
      CR_SETTING_DEFAULT_thumb_ffmpeg_enabled: "${CR_SETTING_DEFAULT_thumb_ffmpeg_enabled:-1}"
      CR_SETTING_DEFAULT_thumb_vips_enabled: "${CR_SETTING_DEFAULT_thumb_vips_enabled:-1}"
      CR_SETTING_DEFAULT_thumb_libreoffice_enabled: "${CR_SETTING_DEFAULT_thumb_libreoffice_enabled:-1}"
      CR_SETTING_DEFAULT_media_meta_ffprobe: "${CR_SETTING_DEFAULT_media_meta_ffprobe:-1}"
      CR_SETTING_DEFAULT_thumb_libraw_enabled: "${CR_SETTING_DEFAULT_thumb_libraw_enabled:-1}"
    volumes:
      - ./storage/cloudrevo:/cloudrevo/data

  postgresql:
    # Best practice: Pin to major version. 
    # NOTE: For major version jumps:
    # backup & consult https://www.postgresql.org/docs/current/pgupgrade.html 
    image: postgres:17    
    container_name: postgresql
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${CLOUDREVO_DB_USER:-cloudrevo}"
      POSTGRES_DB: "${CLOUDREVO_DB_NAME:-cloudrevo}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env before starting Compose}"
    volumes:
      - ./storage/postgresql:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:latest
    container_name: redis
    restart: unless-stopped
    volumes:
      - ./storage/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  gopeed:
    build:
      context: .
      dockerfile: .build/gopeed.Dockerfile
      args:
        VERSION: v1.9.3
        GO_PROXY: https://goproxy.cn|https://proxy.golang.org,direct
    container_name: gopeed
    restart: unless-stopped
    environment:
      GOPEED_APITOKEN: "${GOPEED_API_TOKEN:?Set GOPEED_API_TOKEN in .env before starting Compose}"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 768m
    cpus: "1.5"
    volumes:
      - ./storage/gopeed:/app/storage
      - ./storage/cloudrevo/temp/gopeed:/app/Downloads
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null --header=\"X-Api-Token: $$GOPEED_APITOKEN\" http://127.0.0.1:9999/api/v1/info"]
      interval: 5s
      timeout: 5s
      retries: 12
