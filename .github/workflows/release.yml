name: Publish CloudRevo

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: Stable release version without a v prefix (for example 4.18.0)
        required: true
        type: string
      release_notes:
        description: Release notes shown in the GitHub Release
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: cloudrevo-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  REGISTRY: ghcr.io/dadastory
  RELEASE_VERSION: ${{ inputs.version || '4.18.0' }}

jobs:
  validate-release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Validate release version
        env:
          VERSION: ${{ inputs.version }}
          NOTES: ${{ inputs.release_notes }}
        run: |
          test -n "$NOTES"
          echo "$VERSION" | grep -Ex '[0-9]+\.[0-9]+\.[0-9]+'
          grep -F "BackendVersion = \"$VERSION\"" application/constants/constants.go
          test "$(grep -c "ARG VERSION=$VERSION" Dockerfile)" -eq 2
          test "$(node -p "require('./assets/package.json').version")" = "$VERSION"
          ! git ls-remote --exit-code --tags origin "refs/tags/v$VERSION"

  build-image:
    needs: validate-release
    if: ${{ always() && (github.event_name == 'push' || needs.validate-release.result == 'success') }}
    name: Build ${{ matrix.image }} (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: cloudrevo
            dockerfile: Dockerfile
            platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - image: cloudrevo
            dockerfile: Dockerfile
            platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
          - image: cloudrevo-gopeed
            dockerfile: .build/gopeed.Dockerfile
            platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - image: cloudrevo-gopeed
            dockerfile: .build/gopeed.Dockerfile
            platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push immutable architecture digest
        id: build
        uses: docker/build-push-action@v6
        timeout-minutes: 50
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          build-args: |
            VERSION=${{ env.RELEASE_VERSION }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true,name=${{ env.REGISTRY }}/${{ matrix.image }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}
      - name: Store image digest
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          printf '%s' "${{ steps.build.outputs.digest }}" > "${RUNNER_TEMP}/digests/${{ matrix.image }}-${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.image }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/${{ matrix.image }}-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

  merge-image:
    needs: build-image
    # `validate-release` is deliberately skipped for push events. The build job
    # handles that with `always()`, so the dependent manifest job must do the
    # same; otherwise GitHub skips it before it can publish `latest`.
    if: ${{ always() && needs.build-image.result == 'success' }}
    name: Merge ${{ matrix.image }} manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image:
          - cloudrevo
          - cloudrevo-gopeed
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-${{ matrix.image }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - name: Merge and inspect multi-architecture manifest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ matrix.image }}
          EVENT_NAME: ${{ github.event_name }}
          VERSION: ${{ env.RELEASE_VERSION }}
        run: |
          set -eu
          test "$(find . -type f | wc -l)" -eq 2
          digest_args="$(find . -type f -exec cat {} \; | xargs -r -n1 printf "${IMAGE}@%s ")"
          test -n "$digest_args"
          if [ "$EVENT_NAME" = "push" ]; then
            docker buildx imagetools create -t "${IMAGE}:latest" $digest_args
            docker buildx imagetools inspect "${IMAGE}:latest"
          else
            docker buildx imagetools create -t "${IMAGE}:${VERSION}" -t "${IMAGE}:v${VERSION}" $digest_args
            docker buildx imagetools inspect "${IMAGE}:v${VERSION}"
          fi
        working-directory: ${{ runner.temp }}/digests

  create-release:
    if: github.event_name == 'workflow_dispatch'
    needs:
      - validate-release
      - merge-image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create release tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a "v$VERSION" -m "CloudRevo $VERSION"
          git push origin "v$VERSION"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: CloudRevo ${{ inputs.version }}
          body: ${{ inputs.release_notes }}
