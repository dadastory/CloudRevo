name: Publish CloudRevo

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: Stable release version without a v prefix (for example 4.18.0)
        required: true
        type: string
      release_notes:
        description: Release notes shown in the GitHub Release
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: cloudrevo-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  publish-latest:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish application latest image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/dadastory/cloudrevo:latest
      - name: Publish Gopeed latest image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .build/gopeed.Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/dadastory/cloudrevo-gopeed:latest

  release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Validate release version
        env:
          VERSION: ${{ inputs.version }}
          NOTES: ${{ inputs.release_notes }}
        run: |
          test -n "$NOTES"
          echo "$VERSION" | grep -Ex '[0-9]+\.[0-9]+\.[0-9]+'
          grep -F "BackendVersion = \"$VERSION\"" application/constants/constants.go
          test "$(grep -c "ARG VERSION=$VERSION" Dockerfile)" -eq 2
          test "$(node -p "require('./assets/package.json').version")" = "$VERSION"
          ! git ls-remote --exit-code --tags origin "refs/tags/v$VERSION"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish application release images
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ inputs.version }}
          tags: |
            ghcr.io/dadastory/cloudrevo:${{ inputs.version }}
            ghcr.io/dadastory/cloudrevo:v${{ inputs.version }}
      - name: Publish Gopeed release images
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .build/gopeed.Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/dadastory/cloudrevo-gopeed:${{ inputs.version }}
            ghcr.io/dadastory/cloudrevo-gopeed:v${{ inputs.version }}
      - name: Create release tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a "v$VERSION" -m "CloudRevo $VERSION"
          git push origin "v$VERSION"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: CloudRevo ${{ inputs.version }}
          body: ${{ inputs.release_notes }}
