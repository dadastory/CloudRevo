version: 2

before:
  hooks:
    - go mod tidy
    - chmod +x ./.build/build-assets.sh
    - ./.build/build-assets.sh {{ .Version }}

builds:
  - env:
      - CGO_ENABLED=0
    binary: cloudrevo
    ldflags:
      - -s -w -X 'github.com/dadastory/CloudRevo/application/constants.BackendVersion={{ .Version }}' -X 'github.com/dadastory/CloudRevo/application/constants.LastCommit={{ .ShortCommit }}'
    goos: [linux, windows, darwin, freebsd]
    goarch: [amd64, arm, arm64, loong64]
    goarm: [5, 6, 7]
    ignore:
      - goos: windows
        goarm: 5
      - goos: windows
        goarm: 6
      - goos: windows
        goarm: 7
      - goos: windows
        goarch: loong64
      - goos: freebsd
        goarch: loong64
      - goos: freebsd
        goarch: arm

archives:
  - formats: ["tar.gz"]
    name_template: >-
      cloudrevo_{{ .Tag }}_{{- .Os }}_{{ .Arch }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats: ["zip"]

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:"]

release:
  draft: true
  prerelease: auto
  target_commitish: "{{ .Commit }}"
  name_template: "{{ .Version }}"
